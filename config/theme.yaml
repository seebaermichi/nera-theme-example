# Theme defaults.
#
# A site's own config/theme.yaml deep-merges OVER this file (objects per key,
# arrays replaced, site wins at the leaf — ROADMAP-themes.md §1c), so a site can
# override a single value and inherit the rest, and still receive new keys the
# theme adds later.
#
# Core merges this file with the site's and exposes the result to templates as
# `app.theme.config` (@nera-static/core 4.6.0+). This example theme's own
# templates do not read it yet: assets/css/main.css sets its colours directly,
# so overriding `colors.primary` changes nothing on the page until a template
# emits it. The file shows the shape a theme's defaults take.

# Human-readable label, for a future themes UI.
label: Example

# Design tokens. A site may override these here; the theme's own main.css reads
# the corresponding CSS custom properties.
colors:
    primary: '#0b7a4b'
